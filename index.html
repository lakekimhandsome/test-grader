<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f3" />
    <meta name="description" content="2점, 3점, 4점 문항의 시험 점수를 빠르게 계산하는 도구" />
    <title>시험 점수 계산기</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <h1>시험 점수 계산기</h1>
        <p class="intro">문항 배점을 누르면 점수가 바로 계산됩니다.</p>
      </header>

      <section class="setup" aria-label="채점 설정">
        <label for="max-score">만점</label>
        <div class="score-input">
          <input id="max-score" type="number" min="1" max="999" inputmode="numeric" value="100" />
          <span>점</span>
        </div>

        <fieldset>
          <legend>채점 방식</legend>
          <div class="mode-switch">
            <label><input type="radio" name="mode" value="earned" checked /><span>득점</span></label>
            <label><input type="radio" name="mode" value="deducted" /><span>감점</span></label>
          </div>
        </fieldset>
      </section>

      <section class="result" aria-live="polite" aria-atomic="true">
        <p id="mode-label">쌓인 점수</p>
        <div class="score"><strong id="current-score">0</strong><span id="score-total">/ 100점</span></div>
        <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
      </section>

      <section class="actions" aria-label="문항 배점">
        <button type="button" data-points="2" aria-keyshortcuts="2"><span>2</span>점 문항<small><b data-count="2">0</b>개</small></button>
        <button type="button" data-points="3" aria-keyshortcuts="3"><span>3</span>점 문항<small><b data-count="3">0</b>개</small></button>
        <button type="button" data-points="4" aria-keyshortcuts="4"><span>4</span>점 문항<small><b data-count="4">0</b>개</small></button>
      </section>

      <div class="secondary-actions">
        <button id="undo" type="button" aria-label="실행 취소" title="실행 취소" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button id="reset" type="button" aria-label="처음부터" title="처음부터">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
      <p class="hint">숫자 키 2·3·4 사용 가능</p>
    </main>
  </body>
</html>
